name: Validate and publish WAYPOINT
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: waypoint-pages
  cancel-in-progress: false

jobs:
  live-data:
    name: Check public Darkstat data
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API responses and CORS with the application client
        run: node scripts/check_live_data.mjs
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare application and navigation
        run: python3 scripts/build.py
      - name: Validate trading and navigation calculations
        run: node --test tests/*.test.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
